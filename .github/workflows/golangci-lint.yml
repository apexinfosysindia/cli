name: golangci-lint

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  golangci:
    name: lint
    runs-on: [self-hosted, apexos-builder]
    steps:
      - uses: actions/checkout@v6.0.3
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: latest
          args: --fix=false
