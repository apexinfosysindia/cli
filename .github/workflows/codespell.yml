name: codespell

on:
  push:
    branches: [main]
  pull_request:

jobs:
  codespell:
    runs-on: ${{ fromJSON(vars.APEXOS_RUNSON_AMD64 || '["self-hosted","apexos-builder","linux","X64"]') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: codespell-project/actions-codespell@v2.2
        with:
          skip: ./.git,./go.sum
